services:
  nutrition-api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Mount data directory for easy updates during development
      - ./DataPrep/usedData:/app/DataPrep/usedData:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
